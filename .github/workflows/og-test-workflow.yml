# og-test-workflow: build OG Software apps for iOS (and send them to TestFlight) with each app's own "Build iOS"
# workflow, from a throwaway copy in this repo. Give it a comma-separated list of repositories; one at a time, in that
# order, each one goes through og-test-one.yml:
#
#   import    clone the repository and its Build iOS workflow (with what that calls) into og-test
#   build     run that Build iOS on GitHub's machines (signed .ipa, TestFlight upload) and wait for it
#   cleanup   always, pass or fail: wipe og-test back to its own .github, delete branches, tags, releases,
#             artifacts, caches and earlier runs, and add this repository's section to last-run.md
#
# A failed repository doesn't stop the list: the next one still runs. last-run.md on main ends up with one section per
# repository of this run (the previous run's log is replaced). The source repositories are only read, never changed.
#
# Secrets: push-github-secrets.ps1 -Only og-test (og-utils). KIT_TOKEN must list og-test in its Repository access
# (Contents and Workflows: read and write) and must be able to read every repository in the list.

name: og-test-workflow

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories, comma-separated: names (nato-squad = github.com/owengerig/nato-squad) or links; name@branch for a branch"
        type: string
        required: true
      bump_version:
        description: "Bump version: start each repo's Build iOS with its current version, patch + 1 (1.3.0 → 1.3.1, 1.3.9 → 1.3.10)"
        type: boolean
        default: false

permissions:
  contents: write   # import commits, cleanup of branches / tags / releases
  actions: write    # start each copied Build iOS; cleanup of artifacts, caches and workflow runs

# one og-test run at a time: a second run waits (never cancels one), so a cleanup can't wipe another run's import
concurrency:
  group: og-test
  cancel-in-progress: false

jobs:
  list:
    name: Read the list
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - name: Read the list
        id: list
        env:
          REPOS: ${{ inputs.repos }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          JSON=$(printf '%s' "$REPOS" | tr ',\n' '\n\n' | python3 -c '
          import json, os, re, sys
          owner = os.environ["OWNER"]
          items = [l.strip() for l in sys.stdin if l.strip()]
          out = []
          for i, item in enumerate(items, 1):
              ref = ""
              if "@" in item.split("/")[-1]:   # name@branch or link@branch
                  item, ref = item.rsplit("@", 1)
              item = item.rstrip("/")
              if re.fullmatch(r"[A-Za-z0-9._-]+", item):   # a bare name: one of our repos
                  url = f"https://github.com/{owner}/{item}"
              elif re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", item):   # owner/name
                  url = f"https://github.com/{item}"
              elif re.fullmatch(r"https://[A-Za-z0-9.-]+/\S+", item):
                  url = item
              else:
                  print(f"::error::\"{item}\" is not a repository name or https link", file=sys.stderr); sys.exit(1)
              name = re.sub(r"\.git$", "", url.rsplit("/", 1)[-1])
              label = name + ("@" + ref if ref else "") + f" ({i} of {len(items)})"
              out.append({"label": label, "url": url, "ref": ref, "total": str(len(items))})
          if not out:
              print("::error::The list is empty", file=sys.stderr); sys.exit(1)
          print(json.dumps(out))
          ')
          echo "repos=$JSON" >> "$GITHUB_OUTPUT"
          {
            echo "### Repositories, in order"
            printf '%s' "$JSON" | jq -r '.[] | "- \(.label): \(.url)\(if .ref != "" then " (\(.ref))" else "" end)"'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$JSON" | jq -r '.[] | "\(.label): \(.url) \(.ref)"'

  # one repository at a time, in the list's order; a failure doesn't stop the ones after it
  repo:
    name: ${{ matrix.label }}
    needs: list
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.repos) }}
    uses: ./.github/workflows/og-test-one.yml
    with:
      repo_url: ${{ matrix.url }}
      ref: ${{ matrix.ref }}
      label: ${{ matrix.label }}
      total: ${{ matrix.total }}
      repo_list: ${{ inputs.repos }}
      bump_version: ${{ inputs.bump_version }}
    secrets: inherit
